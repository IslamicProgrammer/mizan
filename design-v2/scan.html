<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Fajr — Skaner</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  body { background: #0B0B10; }

  /* the camera feed, stood in for by a dim room at 5am */
  .feed { position: absolute; inset: 0; overflow: hidden; }
  .feed .room {
    position: absolute; inset: 0;
    background:
      radial-gradient(80% 50% at 50% 86%, rgba(120,104,84,.30) 0%, transparent 62%),
      linear-gradient(180deg, #0B0B10 0%, #14131A 52%, #1B1820 100%);
  }
  .feed .mat {
    position: absolute; left: 0; right: 0; top: 318px; height: 236px;
    background: linear-gradient(180deg, rgba(164,141,111,.38) 0%, rgba(104,88,70,.20) 62%, rgba(74,63,52,.12) 100%);
    clip-path: polygon(31% 0%, 69% 0%, 93% 100%, 7% 100%);
  }
  .feed .mat::after {
    content: ""; position: absolute; left: 39%; right: 39%; top: 13%; height: 27%;
    border: 2px solid rgba(222,204,178,.26); border-bottom: 0;
    border-radius: 999px 999px 0 0;
  }
  .feed .floor {
    position: absolute; left: 0; right: 0; top: 300px; height: 300px;
    background: radial-gradient(60% 70% at 50% 40%, rgba(180,150,112,.14) 0%, transparent 70%);
  }
  .vig {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11,11,16,.94) 0%, rgba(11,11,16,.08) 26%,
                rgba(11,11,16,.10) 56%, rgba(11,11,16,.93) 100%);
  }

  .top { position: relative; padding: 58px 26px 0; display: flex; align-items: flex-start; gap: 14px; }
  .top .x { width: 34px; height: 34px; margin-left: -8px; color: var(--dim); display: flex; }
  .top .who { flex: 1; }
  .top .who .k { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--dim); }
  .top .who .v { font-family: var(--serif); font-size: 22px; font-weight: 500; margin-top: 3px; }
  .top .t { font-family: var(--mono); font-size: 15px; color: var(--dawn); padding-top: 4px; }

  /* the reticle uses the same 2px stroke as the rail */
  .aim { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
  .box { position: relative; width: 246px; height: 246px; }
  .box i {
    position: absolute; width: 40px; height: 40px;
    border: 2px solid var(--dawn); opacity: .9;
  }
  .box i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .box i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .box i:nth-child(3) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  .box i:nth-child(4) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .box .sweep {
    position: absolute; left: 0; right: 0; top: 54%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--dawn), transparent);
    opacity: .8;
  }

  .bot { position: relative; padding: 0 26px 44px; }

  .state { display: flex; align-items: baseline; gap: 10px; }
  .state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dawn); align-self: center; }
  .state .s { font-family: var(--serif); font-size: 19px; font-weight: 400; }
  .state .p { font-family: var(--mono); font-size: 14px; color: var(--dawn); margin-left: auto; }

  /* progress reuses the now-bar from home */
  .meter { margin-top: 16px; height: 2px; background: var(--rail); position: relative; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 58%; background: var(--dawn); }

  .note {
    margin-top: 26px; font-size: 12.5px; line-height: 1.6; color: var(--dim);
    display: flex; gap: 9px; align-items: flex-start;
  }
  .note svg { flex: none; margin-top: 2px; opacity: .6; }

  .escape {
    margin-top: 26px; display: flex; align-items: center; justify-content: center; gap: 9px;
    font-family: var(--mono); font-size: 12px; color: var(--rail-lit); letter-spacing: .02em;
  }
</style>
</head>
<body>
<div class="screen">

  <div class="feed">
    <div class="room"></div>
    <div class="floor"></div>
    <div class="mat"></div>
    <div class="vig"></div>
  </div>

  <div class="top">
    <span class="x">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </span>
    <span class="who">
      <span class="k">skanerlang</span>
      <div class="v">Joynamoz</div>
    </span>
    <span class="t">05:12</span>
  </div>

  <div class="aim">
    <div class="box">
      <i></i><i></i><i></i><i></i>
      <span class="sweep"></span>
    </div>
  </div>

  <div class="bot">
    <div class="state">
      <span class="dot"></span>
      <span class="s">Qidirilmoqda</span>
      <span class="p">58%</span>
    </div>
    <div class="meter"><i></i></div>

    <div class="note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 19 6v6c0 4.4-3 7.6-7 8.8-4-1.2-7-4.4-7-8.8V6z"/></svg>
      Rasm saqlanmaydi va hech qayerga yuborilmaydi. Ilova buyumni ko'rganini tasdiqlaydi, namoz o'qiganingizni emas.
    </div>

    <div class="escape">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>
      o'chirish uchun 10 soniya bosib turing
    </div>
  </div>

</div>
</body>
</html>
