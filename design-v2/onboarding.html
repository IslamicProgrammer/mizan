<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Fajr — Onboarding</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* progress reads as elapsed distance along the same rail language */
  .prog { display: flex; align-items: center; gap: 14px; }
  .prog .track { flex: 1; height: 2px; background: var(--rail); position: relative; }
  .prog .track i { position: absolute; inset: 0 auto 0 0; width: 33%; background: var(--dawn); }
  .prog .n { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .back { width: 34px; height: 34px; margin-left: -9px; display: flex; align-items: center; color: var(--dim); }

  .ask { margin-top: 52px; }
  .ask h1 {
    font-family: var(--serif); font-weight: 500; font-size: 33px;
    line-height: 1.24; letter-spacing: -.012em;
  }
  .ask p {
    margin-top: 14px; font-size: 14.5px; line-height: 1.6;
    color: var(--dim); max-width: 30ch;
  }

  /* options: rows on hairlines, not five identical cards */
  .opts { margin-top: 36px; }
  .opt {
    display: flex; align-items: center; gap: 15px;
    height: 72px; border-bottom: 1px solid var(--hair);
    cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0;
    width: 100%; text-align: left; font-family: inherit; padding: 0;
  }
  .opt:first-child { border-top: 1px solid var(--hair); }

  .pip {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    box-shadow: inset 0 0 0 1.5px var(--rail);
  }
  .opt.on .pip {
    background: var(--dawn); box-shadow: 0 0 0 4px rgba(255,158,79,.15);
  }

  .opt .l {
    flex: 1; font-family: var(--serif); font-size: 19px; font-weight: 400;
    color: var(--bone); letter-spacing: -.005em;
  }
  .opt.on .l { color: var(--dawn); font-weight: 500; }

  .opt .r {
    font-family: var(--mono); font-size: 13px; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .opt.on .r { color: var(--dawn); }

  .foot { margin-top: auto; padding-bottom: 30px; display: flex; flex-direction: column; gap: 6px; }
  .foot .hint {
    font-family: var(--serif); font-style: italic; font-size: 13.5px;
    color: var(--dim); text-align: center; padding-bottom: 14px;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="sky"></div>

  <div class="body">

    <div class="prog">
      <span class="back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"/></svg>
      </span>
      <span class="track"><i></i></span>
      <span class="n">04 / 12</span>
    </div>

    <div class="ask">
      <h1>Hozir qanchalik muntazam o'qiyapsiz?</h1>
      <p>To'g'ri javob yo'q. Bu faqat boshlang'ich nuqtangizni belgilaydi.</p>
    </div>

    <div class="opts">
      <button class="opt" type="button">
        <span class="pip"></span>
        <span class="l">Barcha besh vaqt</span>
        <span class="r">5</span>
      </button>
      <button class="opt on" type="button">
        <span class="pip"></span>
        <span class="l">Ko'pini o'qiyman</span>
        <span class="r">3–4</span>
      </button>
      <button class="opt" type="button">
        <span class="pip"></span>
        <span class="l">Ba'zi vaqtlarda</span>
        <span class="r">1–2</span>
      </button>
      <button class="opt" type="button">
        <span class="pip"></span>
        <span class="l">Endi boshlayapman</span>
        <span class="r">0</span>
      </button>
      <button class="opt" type="button">
        <span class="pip"></span>
        <span class="l">Aytmayman</span>
        <span class="r">—</span>
      </button>
    </div>

    <div class="foot">
      <div class="hint">bu javobni keyin ham o'zgartirasiz</div>
      <a class="act" href="#">Davom etish</a>
    </div>

  </div>
</div>
</body>
</html>
