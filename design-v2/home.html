<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Fajr — Bosh sahifa</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400&display=swap">
<style>
  :root {
    --night:  #12121A;
    --raised: #1A1A24;
    --bone:   #EDE6DA;
    --dim:    #8A8AA0;
    --rail:   #2E2E3C;
    --rail-lit: #4A4A5E;
    --dawn:   #FF9E4F;
    --jade:   #5FA88C;

    --serif: 'Lora', Georgia, serif;
    --sans:  'IBM Plex Sans', system-ui, sans-serif;
    --mono:  'IBM Plex Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 390px; height: 844px;
    background: var(--night);
    color: var(--bone);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .screen { height: 100%; display: flex; flex-direction: column; }

  /* the one atmospheric gesture: light bleeding in from where the sun is */
  .sky {
    position: absolute; inset: 0 0 auto 0; height: 340px;
    background: radial-gradient(120% 100% at 78% -8%, rgba(255,158,79,.22) 0%, rgba(255,158,79,.06) 44%, transparent 68%);
    pointer-events: none;
  }

  .body { position: relative; flex: 1; padding: 58px 26px 0; display: flex; flex-direction: column; }

  /* ---- place ---- */

  .place {
    font-size: 13px; font-weight: 500; letter-spacing: .01em;
    color: var(--dim);
    display: flex; align-items: center; gap: 7px;
  }
  .place svg { opacity: .7; }

  /* ---- hero ---- */

  .hero { margin-top: 34px; }

  .hero .label {
    font-family: var(--serif); font-size: 15px; font-style: italic;
    color: var(--dim); letter-spacing: .01em;
  }

  .hero .name {
    font-family: var(--serif); font-weight: 500;
    font-size: 42px; line-height: 1.1; letter-spacing: -.01em;
    margin-top: 6px;
  }

  .hero .clock {
    display: flex; align-items: baseline; gap: 14px; margin-top: 2px;
  }

  .hero .time {
    font-family: var(--mono); font-weight: 300;
    font-size: 76px; line-height: 1.05; letter-spacing: -.05em;
    font-variant-numeric: tabular-nums;
  }
  /* the colon is punctuation, not a digit — let the numerals carry the weight */
  .hero .time i { font-style: normal; color: var(--rail-lit); margin: 0 -.08em; }

  .hero .arabic {
    font-family: 'Noto Naskh Arabic', serif; font-size: 26px;
    color: var(--rail-lit); margin-left: auto; align-self: flex-end; padding-bottom: 20px;
  }

  .hero .until {
    font-family: var(--mono); font-size: 14px; font-weight: 400;
    color: var(--dawn); margin-top: 10px; letter-spacing: .01em;
  }
  .hero .until em {
    font-family: var(--sans); font-style: normal; font-size: 13.5px;
    color: var(--dim); letter-spacing: 0; padding-left: 3px;
  }

  /* ---- the arc: the day as one measured line ---- */

  .arc { margin-top: 36px; }

  .stop { display: flex; align-items: center; height: 60px; }

  .rail { position: relative; width: 26px; flex: none; align-self: stretch; }
  .rail::before {
    content: ""; position: absolute; left: 11px; top: 0; bottom: 0;
    width: 2px; background: var(--rail);
  }
  .stop.lit .rail::before { background: var(--rail-lit); }
  .stop:first-child .rail::before { top: 50%; }
  .stop:last-child  .rail::before { bottom: 50%; }

  .mark {
    position: absolute; left: 12px; top: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--rail-lit);
  }
  .mark.done { background: var(--jade); }
  .mark.next {
    width: 13px; height: 13px; background: var(--dawn);
    box-shadow: 0 0 0 5px rgba(255,158,79,.15);
  }
  .mark.hollow { background: var(--night); box-shadow: inset 0 0 0 2px var(--rail); }

  .stop .n {
    font-family: var(--serif); font-size: 18px; font-weight: 400;
    color: var(--bone); flex: 1; padding-left: 4px;
  }
  .stop .t {
    font-family: var(--mono); font-size: 16px; font-weight: 400;
    font-variant-numeric: tabular-nums; color: var(--bone); letter-spacing: -.01em;
  }

  .stop.past .n, .stop.past .t { color: var(--dim); }
  .stop.next .n { color: var(--dawn); font-weight: 500; }
  .stop.next .t { color: var(--dawn); }
  .stop.minor .n { font-family: var(--sans); font-size: 13px; font-weight: 400; color: var(--dim); }
  .stop.minor .t { font-size: 13px; color: var(--dim); }
  .stop.minor { height: 44px; }

  /* the present moment, drawn across the rail */
  .now { display: flex; align-items: center; height: 32px; }
  .now .rail { position: relative; width: 26px; flex: none; align-self: stretch; }
  .now .rail::before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: var(--rail-lit); }
  .now .bar { flex: 1; height: 1px; background: linear-gradient(90deg, var(--dawn), rgba(255,158,79,0)); margin-left: 4px; }
  .now .t {
    font-family: var(--mono); font-size: 12px; color: var(--dawn);
    letter-spacing: .04em; padding-left: 10px;
  }

  /* ---- growth, as a line of type not a card ---- */

  .growth {
    margin-top: auto; padding: 0 0 22px;
    display: flex; align-items: flex-end; gap: 14px;
  }
  .growth .k { font-family: var(--serif); font-size: 15px; font-style: italic; color: var(--dim); }
  .growth .v { font-family: var(--mono); font-size: 15px; color: var(--bone); }
  .spark { display: flex; align-items: flex-end; gap: 5px; margin-left: auto; height: 30px; }
  .spark i { width: 8px; border-radius: 1.5px; background: var(--rail-lit); display: block; }
  .spark i.f { background: var(--jade); }
  .spark i.t { background: var(--dawn); }

  /* ---- nav ---- */

  nav {
    height: 76px; flex: none;
    border-top: 1px solid rgba(237,230,218,.07);
    display: flex; align-items: flex-start; padding: 13px 14px 0;
  }
  nav a {
    flex: 1; text-decoration: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: var(--dim); opacity: .72;
  }
  nav a.on { color: var(--dawn); opacity: 1; }
  nav span { font-size: 10.5px; font-weight: 500; letter-spacing: .01em; }
</style>
</head>
<body>
<div class="screen">
  <div class="sky"></div>

  <div class="body">

    <div class="place">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.8"/></svg>
      Toshkent
    </div>

    <div class="hero">
      <div class="label">keyingisi</div>
      <div class="name">Asr</div>
      <div class="clock">
        <div class="time">16<i>:</i>34</div>
        <div class="arabic">العصر</div>
      </div>
      <div class="until">2s 31d <em>qoldi</em></div>
    </div>

    <div class="arc">

      <div class="stop past lit">
        <div class="rail"><span class="mark done"></span></div>
        <div class="n">Bomdod</div>
        <div class="t">05:12</div>
      </div>

      <div class="stop minor past lit">
        <div class="rail"><span class="mark hollow"></span></div>
        <div class="n">Quyosh chiqishi</div>
        <div class="t">06:38</div>
      </div>

      <div class="stop past lit">
        <div class="rail"><span class="mark done"></span></div>
        <div class="n">Peshin</div>
        <div class="t">12:25</div>
      </div>

      <div class="now">
        <div class="rail"></div>
        <div class="t">14:03</div>
        <div class="bar"></div>
      </div>

      <div class="stop next">
        <div class="rail"><span class="mark next"></span></div>
        <div class="n">Asr</div>
        <div class="t">16:34</div>
      </div>

      <div class="stop">
        <div class="rail"><span class="mark hollow"></span></div>
        <div class="n">Shom</div>
        <div class="t">18:36</div>
      </div>

      <div class="stop">
        <div class="rail"><span class="mark hollow"></span></div>
        <div class="n">Xufton</div>
        <div class="t">20:02</div>
      </div>

    </div>

    <div class="growth">
      <span class="k">bog'ingiz</span>
      <span class="v">17 kun</span>
      <span class="spark">
        <i class="f" style="height:11px"></i>
        <i class="f" style="height:16px"></i>
        <i style="height:9px"></i>
        <i class="f" style="height:19px"></i>
        <i class="f" style="height:22px"></i>
        <i class="f" style="height:20px"></i>
        <i class="t" style="height:13px"></i>
      </span>
    </div>

  </div>

  <nav>
    <a class="on" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11 12 4l8 7"/><path d="M6.5 9.8V20h11V9.8"/></svg>
      <span>Bugun</span>
    </a>
    <a href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.2 2"/></svg>
      <span>Vaqtlar</span>
    </a>
    <a href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5v-3a3.5 3.5 0 0 1 7 0v3"/></svg>
      <span>Fokus</span>
    </a>
    <a href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20.5V11"/><path d="M12 11C12 7.4 9.4 5.5 5.6 5.5 5.6 9.1 8.2 11 12 11z"/><path d="M12 11c0-3 2.2-4.6 5.4-4.6C17.4 9.4 15.2 11 12 11z"/></svg>
      <span>Bog'</span>
    </a>
    <a href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20 4.8 12.9a4.4 4.4 0 1 1 7.2-5A4.4 4.4 0 1 1 19.2 12.9z"/></svg>
      <span>Ehson</span>
    </a>
  </nav>
</div>
</body>
</html>
