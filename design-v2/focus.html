<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Fajr — Fokus</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* an interruption should feel like the room went quiet, not like a wall */
  body { background: #0E0E15; }
  .hush {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(90% 60% at 50% 34%, rgba(255,158,79,.10) 0%, transparent 62%);
  }

  .body { padding: 0 34px 212px; justify-content: center; }

  .which {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--dim);
  }
  .which .pip {
    width: 9px; height: 9px; border-radius: 50%; background: var(--dawn);
    box-shadow: 0 0 0 4px rgba(255,158,79,.15);
  }

  h1 {
    font-family: var(--serif); font-weight: 400; font-size: 34px;
    line-height: 1.3; letter-spacing: -.012em; margin-top: 22px;
  }

  .left { margin-top: 44px; display: flex; align-items: baseline; gap: 12px; }
  .left .v {
    font-family: var(--mono); font-weight: 300; font-size: 66px;
    line-height: 1; letter-spacing: -.05em; font-variant-numeric: tabular-nums;
    color: var(--dawn);
  }
  .left .u { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--dim); }
  .left .colon { color: rgba(255,158,79,.42); }

  /* the same rail, measuring what is left of the prayer window */
  .window { margin-top: 30px; }
  .window .track { height: 2px; background: var(--rail); position: relative; }
  .window .track i { position: absolute; inset: 0 auto 0 0; width: 38%; background: var(--dawn); }
  .window .ends {
    display: flex; justify-content: space-between; margin-top: 10px;
    font-family: var(--mono); font-size: 12px; color: var(--dim);
  }

  .what {
    margin-top: 40px; font-size: 14.5px; line-height: 1.65; color: var(--dim);
    max-width: 32ch;
  }
  .what b { color: var(--bone); font-weight: 500; }

  .acts { position: absolute; left: 34px; right: 34px; bottom: 42px; display: flex; flex-direction: column; gap: 10px; }
  .acts .off {
    text-align: center; font-size: 13px; color: var(--rail-lit);
    padding-top: 10px; text-decoration: none;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="hush"></div>

  <div class="body">

    <div class="which"><span class="pip"></span> hozir Asr vaqti</div>

    <h1>Instagram Asrdan keyin ochiladi.</h1>

    <div class="left">
      <span class="v">11<i class="colon">:</i>42</span>
      <span class="u">qoldi</span>
    </div>

    <div class="window">
      <div class="track"><i></i></div>
      <div class="ends"><span>16:34</span><span>18:36</span></div>
    </div>

    <p class="what">
      Fokus rejimini <b>siz</b> yoqqansiz. Istalgan vaqtda to'xtatasiz — bu qulf emas, eslatma.
    </p>

  </div>

  <div class="acts">
    <a class="act" href="#">Asrni o'qidim</a>
    <a class="act ghost" href="#">5 daqiqa kutish</a>
    <a class="off" href="#">bugunga fokusni o'chirish</a>
  </div>

</div>
</body>
</html>
