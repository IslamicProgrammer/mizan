<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Fajr — Bog'</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  .head { margin-top: 26px; }
  .head .k { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--dim); }
  .head .big {
    display: flex; align-items: baseline; gap: 13px; margin-top: 4px;
  }
  .head .big .v {
    font-family: var(--mono); font-weight: 300; font-size: 74px;
    line-height: 1.05; letter-spacing: -.05em; font-variant-numeric: tabular-nums;
  }
  .head .big .u { font-family: var(--serif); font-size: 24px; color: var(--dim); }
  .head .sub { font-size: 13.5px; color: var(--dim); margin-top: 6px; }

  /* the record: the same rail, running back through the days */
  .record { margin-top: 30px; flex: 1; overflow: hidden; }

  .day { display: flex; align-items: center; height: 44px; }
  .day .d {
    font-family: var(--mono); font-size: 13px; color: var(--dim);
    width: 62px; flex: none; padding-left: 4px; font-variant-numeric: tabular-nums;
  }
  .day .marks { display: flex; gap: 7px; margin-left: 4px; }
  .day .marks i {
    width: 7px; height: 7px; border-radius: 50%; display: block;
    box-shadow: inset 0 0 0 1.5px var(--rail);
  }
  .day .marks i.y { background: var(--jade); box-shadow: none; }
  .day .marks i.p { background: var(--rail-lit); box-shadow: none; }
  .day .tag {
    margin-left: auto; font-family: var(--serif); font-style: italic;
    font-size: 13px; color: var(--dim);
  }

  .day.today .d { color: var(--dawn); }
  .day.today .tag { color: var(--dawn); font-style: normal; font-family: var(--mono); font-size: 12px; }

  /* a month is a change of ground, marked once */
  .month { display: flex; align-items: center; height: 46px; }
  .month .l {
    font-family: var(--serif); font-size: 15px; color: var(--dim);
    padding-left: 4px;
  }
  .month .line { flex: 1; height: 1px; background: var(--hair); margin-left: 14px; }

  /* a milestone earns one hairline and one word */
  .mile { display: flex; align-items: center; height: 38px; }
  .mile .l {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--dawn); padding-left: 4px;
  }
  .mile .rail::before { background: var(--rail-lit); }
  .mile .line {
    flex: 1; height: 1px; margin-left: 12px;
    background: linear-gradient(90deg, rgba(255,158,79,.5), rgba(255,158,79,0));
  }
</style>
</head>
<body>
<div class="screen">
  <div class="sky"></div>

  <div class="body">

    <div class="head">
      <div class="k">bog'ingiz</div>
      <div class="big">
        <span class="v">17</span>
        <span class="u">kun</span>
      </div>
      <div class="sub">uzluksiz o'smoqda · eng uzuni 23 kun</div>
    </div>

    <div class="record">

      <div class="day today lit">
        <div class="rail"><span class="mark next"></span></div>
        <div class="d">28 sen</div>
        <div class="marks"><i class="y"></i><i class="y"></i><i class="p"></i><i></i><i></i></div>
        <div class="tag">bugun</div>
      </div>

      <div class="day lit">
        <div class="rail"><span class="mark done"></span></div>
        <div class="d">27 sen</div>
        <div class="marks"><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i></div>
      </div>

      <div class="day lit">
        <div class="rail"><span class="mark done"></span></div>
        <div class="d">26 sen</div>
        <div class="marks"><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i></div>
      </div>

      <div class="mile lit">
        <div class="rail"></div>
        <div class="l">ikki hafta</div>
        <div class="line"></div>
      </div>

      <div class="day lit">
        <div class="rail"><span class="mark done"></span></div>
        <div class="d">25 sen</div>
        <div class="marks"><i class="y"></i><i class="y"></i><i></i><i class="y"></i><i class="y"></i></div>
      </div>

      <div class="day lit">
        <div class="rail"><span class="mark done"></span></div>
        <div class="d">24 sen</div>
        <div class="marks"><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i></div>
      </div>

      <div class="day lit">
        <div class="rail"><span class="mark done"></span></div>
        <div class="d">23 sen</div>
        <div class="marks"><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i></div>
      </div>

      <div class="day lit">
        <div class="rail"><span class="mark done"></span></div>
        <div class="d">22 sen</div>
        <div class="marks"><i class="y"></i><i class="y"></i><i class="y"></i><i></i><i class="y"></i></div>
      </div>

      <div class="month">
        <div class="rail"></div>
        <div class="l">Avgust</div>
        <div class="line"></div>
      </div>

      <div class="day">
        <div class="rail"><span class="mark hollow"></span></div>
        <div class="d">31 avg</div>
        <div class="marks"><i class="y"></i><i></i><i></i><i class="y"></i><i></i></div>
      </div>

      <div class="day">
        <div class="rail"><span class="mark hollow"></span></div>
        <div class="d">30 avg</div>
        <div class="marks"><i class="y"></i><i class="y"></i><i></i><i></i><i></i></div>
      </div>

      <div class="day">
        <div class="rail"><span class="mark hollow"></span></div>
        <div class="d">29 avg</div>
        <div class="marks"><i class="y"></i><i></i><i></i><i></i><i></i></div>
      </div>

    </div>

  </div>

  <nav>
    <a href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11 12 4l8 7"/><path d="M6.5 9.8V20h11V9.8"/></svg>
      <span>Bugun</span>
    </a>
    <a href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.2 2"/></svg>
      <span>Vaqtlar</span>
    </a>
    <a href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5v-3a3.5 3.5 0 0 1 7 0v3"/></svg>
      <span>Fokus</span>
    </a>
    <a class="on" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20.5V11"/><path d="M12 11C12 7.4 9.4 5.5 5.6 5.5 5.6 9.1 8.2 11 12 11z"/><path d="M12 11c0-3 2.2-4.6 5.4-4.6C17.4 9.4 15.2 11 12 11z"/></svg>
      <span>Bog'</span>
    </a>
    <a href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20 4.8 12.9a4.4 4.4 0 1 1 7.2-5A4.4 4.4 0 1 1 19.2 12.9z"/></svg>
      <span>Ehson</span>
    </a>
  </nav>
</div>
</body>
</html>
