plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'uz.mizan.appwatch'
version = '0.1.0'

android {
  namespace "uz.mizan.appwatch"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // NotificationCompat, for FocusService's foreground-service notification --
  // matches the version expo-notifications already resolves elsewhere in
  // this app, so Gradle never has two conflicting requests for it.
  implementation 'androidx.core:core:1.17.0'

  // ForegroundAppTracker and PresentationGate are deliberately plain Kotlin,
  // with no Android types in their public surface, so they can be tested
  // here with plain JUnit -- no Robolectric, no device or emulator needed.
  // Same version expo-modules-core itself pins for its own local unit tests.
  testImplementation 'junit:junit:4.13.2'
}
