<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#F8F2EA"/><g id="icon">
    <!-- deep brown tile, full square 0..512 -->
    <rect x="0" y="0" width="512" height="512" fill="#50320F"/>

    <!-- meem in square Kufic: unit = 64. every bar 64 thick, every gap 64 wide -->
    <!-- closed square ring (the head): outer 128,64 -> 384,320 ; hole 192,128 -> 320,256 -->
    <rect x="128" y="64"  width="256" height="64"  fill="#E8B762"/>
    <rect x="128" y="256" width="256" height="64"  fill="#E8B762"/>
    <rect x="128" y="64"  width="64"  height="256" fill="#E8B762"/>
    <rect x="320" y="64"  width="64"  height="256" fill="#E8B762"/>

    <!-- tail (the descender): drops from the ring's bottom edge to y=448 -->
    <rect x="128" y="320" width="64"  height="128" fill="#E8B762"/>
  </g>

  </svg>