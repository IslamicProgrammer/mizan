<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#F8F2EA"/><g id="icon">
    <rect width="512" height="512" rx="112" fill="#50320F"/>

    <!-- head: a small closed loop, upper right -->
    <path fill="#E8B762" fill-rule="evenodd"
          d="M330 96a74 74 0 1 1 0 148 74 74 0 0 1 0-148z
             M330 140a30 30 0 1 0 0 60 30 30 0 0 0 0-60z"/>

