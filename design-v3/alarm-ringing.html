<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><title>Mizan — Signal</title>
<link rel="icon" href="assets/img/mizan-mark.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* ADAPTED: no reference for a 5am lock-screen alarm (design-system.md §5).
     Built from the measured numeral treatment and the same gold, on a night ground. */
  body{background:#141019}
  .sky{position:absolute;inset:0;background:
    linear-gradient(180deg,#141019 0%,#241B2E 40%,#43304A 70%,#7A4A38 100%)}
  .stars{position:absolute;inset:0;opacity:.6}
  .mosque{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:330px;opacity:.22;
          filter:brightness(0) invert(1)}
  .body{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;padding:0 28px}
  .chip{margin-top:104px;display:flex;align-items:center;gap:9px;padding:9px 18px;border-radius:999px;
        background:rgba(248,220,166,.14)}
  .chip img{width:20px;height:20px}
  .chip b{font-size:12.5px;font-weight:700;letter-spacing:1.4px;color:#F8DCA6}
  .t{margin-top:32px;font-size:92px;font-weight:900;line-height:1;letter-spacing:-3px;
     color:#FDF6E9;font-variant-numeric:tabular-nums}
  .nm{margin-top:8px;font-size:22px;font-weight:700;color:#E9C9A0}
  .say{margin-top:26px;text-align:center;font-size:18px;font-weight:600;line-height:1.45;color:#F1E1CE}
  .btnwrap{margin-top:auto;margin-bottom:18px;position:relative;width:176px;height:176px;
           display:flex;align-items:center;justify-content:center}
  .btnwrap .h1,.btnwrap .h2{position:absolute;border-radius:50%}
  .btnwrap .h1{inset:0;background:rgba(248,220,166,.08)}
  .btnwrap .h2{inset:20px;background:rgba(248,220,166,.13)}
  .scan{position:relative;width:136px;height:136px;border-radius:50%;text-decoration:none;
        background:linear-gradient(155deg,#FBE3B4,#E9A644);display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:7px;box-shadow:0 16px 38px rgba(233,166,68,.4)}
  .scan img{width:38px;height:38px}
  .scan b{font-size:13.5px;font-weight:800;color:#4A3210}
  .esc{margin-bottom:54px;display:flex;align-items:center;gap:9px;padding:13px 22px;border-radius:999px;
       border:1.5px solid rgba(245,230,210,.24);font-size:12.5px;font-weight:600;color:#C7B3A8}
</style>
</head>
<body>
<div class="screen">
  <div class="sky"></div>
  <svg class="stars" viewBox="0 0 390 300" fill="#F8DCA6"><circle cx="52" cy="48" r="1.7"/><circle cx="128" cy="26" r="1.2"/><circle cx="206" cy="62" r="1.8"/><circle cx="292" cy="34" r="1.3"/><circle cx="342" cy="86" r="1.6"/><circle cx="88" cy="112" r="1.2"/><circle cx="244" cy="132" r="1.4"/><circle cx="18" cy="150" r="1.1"/><circle cx="318" cy="168" r="1.3"/><circle cx="160" cy="96" r="1.1"/></svg>
  <img class="mosque" src="assets/mosque.svg" alt="">

  <div class="body">
    <span class="chip"><img src="assets/icons/alarm.png" alt=""><b>BOMDOD VAQTI</b></span>
    <div class="t">05:36</div>
    <div class="nm">Bomdod</div>
    <div class="say">Turing va joynamozingizni<br>skanerlang</div>

    <div class="btnwrap">
      <span class="h1"></span><span class="h2"></span>
      <a class="scan" href="scan.html">
        <img src="assets/icons/camera.png" alt="">
        <b>Skanerlash</b>
      </a>
    </div>
    <span class="esc">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>
      o'chirish uchun 10 soniya bosib turing
    </span>
  </div>
</div>
</body>
</html>
