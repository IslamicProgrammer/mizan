<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Mizan — Premium</title>
<link rel="icon" href="assets/img/mizan-mark.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="onb.css">
<style>
  .glow{height:460px}
  .top{position:relative;padding:4px var(--gutter) 0;display:flex;justify-content:flex-end;flex:none}
  .top button{width:34px;height:34px;border:0;border-radius:12px;background:rgba(255,253,248,.7);
              display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cap{position:relative;padding:0 var(--gutter);text-align:center;flex:none;margin-top:6px}
  .cap .mk{width:74px;height:74px;margin:0 auto;border-radius:26px;display:flex;align-items:center;
           justify-content:center;background:linear-gradient(155deg,#FBE3B4,#E9A644);
           box-shadow:0 12px 28px rgba(197,138,46,.3)}
  .cap .mk img{width:38px;height:38px}
  .cap h1{margin-top:20px;font-size:26px;font-weight:800;line-height:1.26;letter-spacing:-.5px}
  .cap p{margin-top:10px;font-size:14px;line-height:1.6;color:var(--ink-soft)}
  .cap p b{color:var(--ink);font-weight:700}
  .feat{position:relative;padding:0 var(--gutter);margin-top:20px;display:flex;flex-direction:column;gap:9px;flex:none}
  .feat div{display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;color:var(--ink)}
  .feat svg{flex:none;color:#5F7D59}
  .plans{position:relative;padding:0 var(--gutter);margin-top:20px;display:flex;flex-direction:column;gap:10px;flex:none}
  .pl{display:flex;align-items:center;gap:13px;width:100%;border:0;cursor:pointer;text-align:left;
      padding:15px 17px;border-radius:20px;background:var(--surface);box-shadow:var(--lift);
      font-family:'Onest',sans-serif}
  .pl.on{box-shadow:0 2px 4px rgba(230,106,67,.14),0 10px 24px rgba(230,106,67,.22)}
  .pl .l{flex:1;display:flex;flex-direction:column;gap:2px}
  .pl b{font-size:15.5px;font-weight:800;color:var(--ink)}
  .pl s{font-size:12px;font-weight:500;color:var(--ink-soft);text-decoration:none}
  .pl .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .pl .tag{padding:3px 9px;border-radius:999px;background:var(--accent);font-size:10px;font-weight:800;color:#FFFDF7}
  .pl .pm{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="screen">
  <div class="glow"></div><div class="bleed"></div>
  <div class="status">9:41<span class="r">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7.5" width="3" height="3.5" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
    <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M22 4v3a2 2 0 0 0 0-3" fill="currentColor" opacity=".5"/></svg>
  </span></div>

  <div class="top"><button type="button" aria-label="Yopish"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A7660" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>

  <div class="cap">
    <span class="mk"><img src="assets/icons/heart.png" alt=""></span>
    <h1>Obunangiz ilovani tirik saqlaydi</h1>
    <p>Xarajatlardan keyin qolgan <b>sof foydaning 100%</b> xayriyaga yo'naltiriladi va har oy ochiq e'lon qilinadi.</p>
  </div>

  <div class="feat">
    <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Kengaytirilgan Bomdod signali</div>
    <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Chuqur Fokus rejimi</div>
    <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>To'liq statistika va qazo hisobi</div>
  </div>

  <div class="plans">
    <button class="pl on" type="button">
      <span class="l"><b>Yillik</b><s>7 kun bepul, keyin 199 000 so'm/yil</s></span>
      <span class="rt"><span class="tag">−33%</span><span class="pm">16 500/oy</span></span>
    </button>
    <button class="pl" type="button">
      <span class="l"><b>Oylik</b><s>Istalgan vaqtda bekor qilasiz</s></span>
      <span class="rt"><span class="pm">24 900/oy</span></span>
    </button>
  </div>

  <div class="foot">
    <a class="act" href="home.html">7 kun bepul boshlash</a>
    <a class="act quiet" href="home.html">Bepul davom etish</a>
  </div>
  <div class="grain"></div>
</div>
</body>
</html>
