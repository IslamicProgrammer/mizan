<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Mizan — Bog'</title>
<link rel="icon" href="assets/img/mizan-mark.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* streak hero — the numeral treatment measured on the home screen, reused */
  .hero{position:relative;padding:0 var(--gutter);margin-top:6px;flex:none;text-align:center}
    .hero .plant{width:88px;height:88px;display:block;margin:0 auto}
  .hero .big{
    margin-top:2px;font-size:78px;font-weight:900;line-height:1;letter-spacing:-2.5px;
    color:var(--ink-warm);font-variant-numeric:tabular-nums;
  }
  .hero .unit{margin-top:2px;font-size:17px;font-weight:700;color:var(--ink)}
  .hero .sub{margin-top:5px;font-size:13px;font-weight:500;color:var(--ink-soft)}

  /* week strip — same 82pt card language, sized to fit seven */
  .week{position:relative;margin:20px var(--gutter) 0;padding:16px 10px;flex:none;
        display:flex;gap:6px}
  .week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .week .d span{font-size:11px;font-weight:600;color:var(--ink-soft)}
  .week .d i{
    width:100%;height:30px;border-radius:10px;display:block;
    background:rgba(80,50,15,.09);
  }
  .week .d.f i{background:linear-gradient(180deg,#E9B563,#DFA346)}
  .week .d.p i{background:linear-gradient(180deg,#F0D6A4,#E7C489)}
  .week .d.t i{background:linear-gradient(180deg,#E9B563,#DFA346);box-shadow:0 0 0 3px rgba(230,106,67,.55)}
  .week .d.t span{color:var(--accent);font-weight:700}

  /* record list */
  .rec{position:relative;margin:0 var(--gutter);display:flex;flex-direction:column;gap:8px;flex:none}
  .row{
    display:flex;align-items:center;gap:13px;padding:11px 15px;border-radius:20px;
    background:var(--surface);box-shadow:var(--lift);
  }
  .row img{width:32px;height:32px;flex:none}
  .row .l{flex:1;display:flex;flex-direction:column;gap:2px}
  .row .l b{font-size:15px;font-weight:700;color:var(--ink)}
  .row .l s{font-size:12px;font-weight:500;color:var(--ink-soft);text-decoration:none}
  .row .dots{display:flex;gap:5px}
  .row .dots i{width:8px;height:8px;border-radius:50%;background:rgba(80,50,15,.14)}
  .row .dots i.y{background:#DFA346}
</style>
</head>
<body>
<div class="screen">
  <div class="glow"></div>
  <div class="bleed"></div>

  <div class="status">
    9:41
    <span class="r">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7.5" width="3" height="3.5" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M22 4v3a2 2 0 0 0 0-3" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>

  <div class="head">
    <a class="ic" href="#" aria-label="Orqaga">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"/></svg>
    </a>
    <span class="title">BOG'</span>
    <span class="sp"></span>
  </div>

  <div class="hero">
    <img class="plant" src="assets/icons/plant.png" alt="">
    <div class="big">17</div>
    <div class="unit">kun uzluksiz</div>
    <div class="sub">eng uzuni 23 kun · bu oy 143 namoz</div>
  </div>

  <div class="week card">
    <div class="d f"><i></i><span>D</span></div>
    <div class="d f"><i></i><span>S</span></div>
    <div class="d p"><i></i><span>C</span></div>
    <div class="d f"><i></i><span>P</span></div>
    <div class="d f"><i></i><span>J</span></div>
    <div class="d f"><i></i><span>Sh</span></div>
    <div class="d t"><i></i><span>Y</span></div>
  </div>

  <div class="sec"><h2>Oxirgi kunlar</h2><a href="#">Barchasi</a></div>

  <div class="rec" style="margin-top:14px">
    <div class="row">
      <img src="assets/icons/sprout.png" alt="">
      <span class="l"><b>Bugun</b><s>4 / 5 o'qildi</s></span>
      <span class="dots"><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i></i></span>
    </div>
    <div class="row">
      <img src="assets/icons/sparkle.png" alt="">
      <span class="l"><b>28 sentabr</b><s>To'liq kun</s></span>
      <span class="dots"><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i></span>
    </div>
    <div class="row">
      <img src="assets/icons/sparkle.png" alt="">
      <span class="l"><b>Ikki hafta</b><s>27 sentabrda yetdingiz</s></span>
      <span class="dots"><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i></span>
    </div>
    <div class="row">
      <img src="assets/icons/sparkle.png" alt="">
      <span class="l"><b>26 sentabr</b><s>To'liq kun</s></span>
      <span class="dots"><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i></span>
    </div>
  </div>

  <nav>
    <a href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11 12 4.2 20 11"/><path d="M6.6 9.8V20h10.8V9.8"/></svg>
      <span>Bosh</span>
    </a>
    <a href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.3V12l3.3 2" stroke-linecap="round"/></svg>
      <span>Vaqtlar</span>
    </a>
    <a class="on" href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M11 21v-9.2C11 8.2 8.4 6.4 4.6 6.4c0 3.6 2.6 5.4 6.4 5.4V21z"/><path d="M13 21v-9.6c0-3 2.2-4.6 5.5-4.6 0 3-2.2 4.6-5.5 4.6V21z"/></svg>
      <span>Bog'</span>

    <a href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.4 4.7 13.2a4.5 4.5 0 1 1 7.3-5.1 4.5 4.5 0 1 1 7.3 5.1z"/></svg>
      <span>Ehson</span>

  </nav>

  <div class="grain"></div>
</div>
</body>
</html>
