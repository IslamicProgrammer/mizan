<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Hozirgi holat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Onest:wght@500;600;700;800&amp;family=Amiri&amp;display=swap">
<style>
body{margin:0;background:#FFFCF6;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#A0620F}a:hover{color:#7A4A0C}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 26px 24px 28px; background: #FFFCF6; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 14px">
    <button type="button" aria-label="Orqaga" style="width: 40px; height: 40px; border: none; border-radius: 14px; background: #F4EBDB; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5842" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"/></svg>
    </button>
    <div style="flex-grow: 1; height: 7px; border-radius: 999px; background: #F1E7D6; overflow: hidden">
      <div style="width: 33%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #F3C87E, #DE9B36)"></div>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: #8A7660">4/12</span>
  </div>

  <div style="margin-top: 34px; font-size: 26px; font-weight: 800; line-height: 1.25; color: #3B2A17; font-family: 'Onest', sans-serif">Hozir qanchalik<br>muntazam o'qiyapsiz?</div>
  <div style="margin-top: 10px; font-size: 14px; line-height: 1.55; color: #7A6753; font-weight: 500">To'g'ri javob yo'q. Bu faqat boshlang'ich nuqtangizni belgilaydi.</div>

  <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 10px">

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 17px 18px; border: 2px solid transparent; border-radius: 20px; background: #FBF5EA; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 40px; height: 40px; border-radius: 14px; background: #E4EDE1; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="font-size: 14px; font-weight: 800; color: #4E6A49; font-family: 'Onest', sans-serif">5</span></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700; color: #3B2A17">Barcha besh vaqt</span>
        <span style="font-size: 12px; color: #8A7660; font-weight: 500">Deyarli hech qaysisini qoldirmayman</span>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 999px; border: 2px solid #DCCFB8; box-sizing: border-box; flex-shrink: 0"></span>
    </button>

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 17px 18px; border: 2px solid #E9A644; border-radius: 20px; background: linear-gradient(140deg, #FCEBC7, #F8DCA6); display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 40px; height: 40px; border-radius: 14px; background: #F3DCB0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="font-size: 14px; font-weight: 800; color: #8A6222; font-family: 'Onest', sans-serif">3-4</span></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 800; color: #3B2A17">Ko'pini o'qiyman</span>
        <span style="font-size: 12px; color: #8A6222; font-weight: 600">Ba'zan bir-ikkitasi qoladi</span>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 999px; background: #C67E22; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
    </button>

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 17px 18px; border: 2px solid transparent; border-radius: 20px; background: #FBF5EA; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 40px; height: 40px; border-radius: 14px; background: #EDE6F1; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="font-size: 14px; font-weight: 800; color: #6B5A80; font-family: 'Onest', sans-serif">1-2</span></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700; color: #3B2A17">Ba'zi vaqtlarda</span>
        <span style="font-size: 12px; color: #8A7660; font-weight: 500">Muntazam emas, lekin o'qiyman</span>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 999px; border: 2px solid #DCCFB8; box-sizing: border-box; flex-shrink: 0"></span>
    </button>

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 17px 18px; border: 2px solid transparent; border-radius: 20px; background: #FBF5EA; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 40px; height: 40px; border-radius: 14px; background: #E8EEF4; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E6480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700; color: #3B2A17">Endi boshlayapman</span>
        <span style="font-size: 12px; color: #8A7660; font-weight: 500">Odat qilmoqchiman</span>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 999px; border: 2px solid #DCCFB8; box-sizing: border-box; flex-shrink: 0"></span>
    </button>

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 17px 18px; border: 2px solid transparent; border-radius: 20px; background: #FBF5EA; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 40px; height: 40px; border-radius: 14px; background: #F0EBE2; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A7660" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v.01"/><path d="M12 15.5c0-3 3-3 3-5.5a3 3 0 1 0-6 0"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700; color: #3B2A17">Aytmaslikni afzal ko'raman</span>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 999px; border: 2px solid #DCCFB8; box-sizing: border-box; flex-shrink: 0"></span>
    </button>

  </div>

  <div style="flex-grow: 1"></div>

  <a href="05-Struggle.html" style="box-sizing: border-box; width: 100%; height: 58px; border-radius: 20px; background: #3B2A17; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 10px 22px rgba(59, 42, 23, 0.22)">
    <span style="font-size: 16px; font-weight: 700; color: #FFF8EC">Davom etish</span>
  </a>

</div>
</body>
</html>
