<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Jins</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Onest:wght@500;600;700;800&amp;family=Amiri&amp;display=swap">
<style>
body{margin:0;background:#FFFCF6;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#A0620F}a:hover{color:#7A4A0C}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 26px 24px 28px; background: #FFFCF6; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 14px">
    <button type="button" aria-label="Orqaga" style="width: 40px; height: 40px; border: none; border-radius: 14px; background: #F4EBDB; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5842" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"/></svg>
    </button>
    <div style="flex-grow: 1; height: 7px; border-radius: 999px; background: #F1E7D6; overflow: hidden">
      <div style="width: 25%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #F3C87E, #DE9B36)"></div>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: #8A7660">3/12</span>
  </div>

  <div style="margin-top: 34px; font-size: 26px; font-weight: 800; line-height: 1.25; color: #3B2A17; font-family: 'Onest', sans-serif">Jinsingizni tanlang</div>
  <div style="margin-top: 10px; font-size: 14px; line-height: 1.55; color: #7A6753; font-weight: 500">Bu namoz hisobini to'g'ri yuritish uchun kerak — juma namozi va hayz kunlari uchun.</div>

  <div style="margin-top: 28px; display: flex; gap: 12px">
    <button type="button" style="flex-grow: 1; flex-basis: 0; box-sizing: border-box; padding: 26px 14px; border: 2px solid transparent; border-radius: 24px; background: #FBF5EA; display: flex; flex-direction: column; align-items: center; gap: 14px; cursor: pointer; font-family: inherit">
      <span style="width: 62px; height: 62px; border-radius: 22px; background: #E8EEF4; display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4E6480" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4.1 3.4-6.5 7.5-6.5s7.5 2.4 7.5 6.5"/></svg>
      </span>
      <span style="font-size: 16px; font-weight: 700; color: #3B2A17; font-family: 'Onest', sans-serif">Erkak</span>
    </button>
    <button type="button" style="flex-grow: 1; flex-basis: 0; box-sizing: border-box; padding: 26px 14px; border: 2px solid #E9A644; border-radius: 24px; background: linear-gradient(150deg, #FCEBC7, #F8DCA6); display: flex; flex-direction: column; align-items: center; gap: 14px; cursor: pointer; font-family: inherit">
      <span style="width: 62px; height: 62px; border-radius: 22px; background: #F6E3E3; display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9E5757" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4.1 3.4-6.5 7.5-6.5s7.5 2.4 7.5 6.5"/></svg>
      </span>
      <span style="font-size: 16px; font-weight: 800; color: #3B2A17; font-family: 'Onest', sans-serif">Ayol</span>
    </button>
  </div>

  <div style="margin-top: 20px; box-sizing: border-box; padding: 16px 18px; border-radius: 20px; background: #FBEFEF; display: flex; gap: 12px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9E5757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4.5M12 8h.01"/></svg>
    <div style="font-size: 13px; line-height: 1.55; color: #8A5B5B; font-weight: 500">Hayz kunlarida namozlar <strong style="font-weight: 700">o'tkazib yuborilgan deb belgilanmaydi</strong>. Bu kunlarni ilovada bir tugma bilan qayd etasiz.</div>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="04-Practice.html" style="box-sizing: border-box; width: 100%; height: 58px; border-radius: 20px; background: #3B2A17; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 10px 22px rgba(59, 42, 23, 0.22)">
    <span style="font-size: 16px; font-weight: 700; color: #FFF8EC">Davom etish</span>
  </a>

</div>
