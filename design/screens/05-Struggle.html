<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Qiyinchilik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Onest:wght@500;600;700;800&amp;family=Amiri&amp;display=swap">
<style>
body{margin:0;background:#FFFCF6;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#A0620F}a:hover{color:#7A4A0C}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 26px 24px 28px; background: #FFFCF6; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 14px">
    <button type="button" aria-label="Orqaga" style="width: 40px; height: 40px; border: none; border-radius: 14px; background: #F4EBDB; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5842" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"/></svg>
    </button>
    <div style="flex-grow: 1; height: 7px; border-radius: 999px; background: #F1E7D6; overflow: hidden">
      <div style="width: 42%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #F3C87E, #DE9B36)"></div>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: #8A7660">5/12</span>
  </div>

  <div style="margin-top: 34px; font-size: 26px; font-weight: 800; line-height: 1.25; color: #3B2A17; font-family: 'Onest', sans-serif">Eng qiyini nima?</div>
  <div style="margin-top: 10px; font-size: 14px; line-height: 1.55; color: #7A6753; font-weight: 500">Bir nechtasini tanlashingiz mumkin. Ilova shunga qarab moslashadi.</div>

  <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 10px">

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 18px; border: 2px solid #E9A644; border-radius: 20px; background: linear-gradient(140deg, #FCEBC7, #F8DCA6); display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 44px; height: 44px; border-radius: 15px; background: #F3DCB0; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A6222" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.5 1.5"/><path d="M5 3 2.5 5.5M19 3l2.5 2.5"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 800; color: #3B2A17">Bomdodga uyg'onolmayman</span>
        <span style="font-size: 12px; color: #8A6222; font-weight: 600">Budilnikni o'chirib yana uxlayman</span>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 8px; background: #C67E22; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
    </button>

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 18px; border: 2px solid #E9A644; border-radius: 20px; background: linear-gradient(140deg, #FCEBC7, #F8DCA6); display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 44px; height: 44px; border-radius: 15px; background: #EAE3F1; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5A80" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18.5h2"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 800; color: #3B2A17">Telefon chalg'itadi</span>
        <span style="font-size: 12px; color: #8A6222; font-weight: 600">Scroll qilib vaqtni o'tkazaman</span>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 8px; background: #C67E22; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
    </button>

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 18px; border: 2px solid transparent; border-radius: 20px; background: #FBF5EA; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 44px; height: 44px; border-radius: 15px; background: #E8EEF4; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4E6480" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700; color: #3B2A17">Vaqtini unutib qo'yaman</span>
        <span style="font-size: 12px; color: #8A7660; font-weight: 500">Ish yoki o'qish orasida</span>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 8px; border: 2px solid #DCCFB8; box-sizing: border-box; flex-shrink: 0"></span>
    </button>

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 18px; border: 2px solid transparent; border-radius: 20px; background: #FBF5EA; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 44px; height: 44px; border-radius: 15px; background: #E4EDE1; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4E6A49" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5 8.5 12l4 4L21 7.5"/><path d="M21 12V7.5h-4.5"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700; color: #3B2A17">Muntazamlik yetishmaydi</span>
        <span style="font-size: 12px; color: #8A7660; font-weight: 500">Bir hafta yaxshi, keyin tashlab yuboraman</span>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 8px; border: 2px solid #DCCFB8; box-sizing: border-box; flex-shrink: 0"></span>
    </button>

  </div>

  <div style="flex-grow: 1"></div>

  <a href="06-Goal.html" style="box-sizing: border-box; width: 100%; height: 58px; border-radius: 20px; background: #3B2A17; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 10px 22px rgba(59, 42, 23, 0.22)">
    <span style="font-size: 16px; font-weight: 700; color: #FFF8EC">Davom etish</span>
  </a>

</div>
</body>
</html>
