<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Namozni belgilash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Onest:wght@500;600;700;800&amp;family=Amiri&amp;display=swap">
<style>
body{margin:0;background:#FFFCF6;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#A0620F}a:hover{color:#7A4A0C}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFCF6; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="box-sizing: border-box; padding: 26px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 21px; font-weight: 800; color: #3B2A17; font-family: 'Onest', sans-serif">Namoz vaqtlari</div>
    <div style="height: 54px; border-radius: 20px; background: #EFF3EC"></div>
    <div style="height: 54px; border-radius: 20px; background: #EFF3EC"></div>
    <div style="height: 62px; border-radius: 22px; background: linear-gradient(150deg, #FCEBC7, #F3C87E)"></div>
    <div style="height: 54px; border-radius: 20px; background: #FBF5EA"></div>
    <div style="height: 54px; border-radius: 20px; background: #FBF5EA"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(43, 31, 17, 0.46)"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 24px 30px; border-radius: 30px 30px 0 0; background: #FFFCF6; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -12px 40px rgba(43, 31, 17, 0.2)">

    <div style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: #E6D9C2"></div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 50px; height: 50px; border-radius: 18px; background: linear-gradient(150deg, #F9D89F, #EFB55C); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5C3A0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 20px; font-weight: 800; color: #3B2A17; font-family: 'Onest', sans-serif">Asr</span>
        <span style="font-size: 12.5px; font-weight: 600; color: #8A7660">16:34 — 18:36 · hozir</span>
      </span>
      <span style="font-size: 24px; color: #A08B70; font-family: 'Amiri', serif">العصر</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">

      <button type="button" style="box-sizing: border-box; width: 100%; padding: 17px 18px; border: none; border-radius: 20px; background: #7E9B78; display: flex; align-items: center; gap: 13px; cursor: pointer; text-align: left; font-family: inherit">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FBFDF9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 6 9 17l-5-5"/></svg>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 800; color: #FBFDF9">O'qidim</span>
      </button>

      <button type="button" style="box-sizing: border-box; width: 100%; padding: 17px 18px; border: none; border-radius: 20px; background: #F4EBDB; display: flex; align-items: center; gap: 13px; cursor: pointer; text-align: left; font-family: inherit">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A6753" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 700; color: #3B2A17">Keyinroq o'qiyman</span>
      </button>

      <button type="button" style="box-sizing: border-box; width: 100%; padding: 17px 18px; border: none; border-radius: 20px; background: #F0F2F5; display: flex; align-items: center; gap: 13px; cursor: pointer; text-align: left; font-family: inherit">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55657A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4.5h4.5"/></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700; color: #3B2A17">Qazoga qo'shish</span>
          <span style="font-size: 11.5px; font-weight: 500; color: #55657A">Keyinroq qaytarasiz</span>
        </span>
      </button>

    </div>

    <div style="height: 1px; background: #F1E7D6"></div>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13.5px; font-weight: 700; color: #3B2A17">Jamoat bilan o'qidim</span>
        <span style="font-size: 11.5px; font-weight: 500; color: #8A7660">Statistikada alohida ko'rinadi</span>
      </span>
      <span style="width: 44px; height: 26px; border-radius: 999px; background: #E6D9C2; display: flex; align-items: center; padding: 3px; box-sizing: border-box; flex-shrink: 0"><span style="width: 20px; height: 20px; border-radius: 999px; background: #FFFCF6"></span></span>
    </div>

  </div>

</div>
</body>
</html>
