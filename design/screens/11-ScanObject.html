<!doctype html>

<style>

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 26px 24px 28px; background: #FFFCF6; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; gap: 14px">
    <button type="button" aria-label="Orqaga" style="width: 40px; height: 40px; border: none; border-radius: 14px; background: #F4EBDB; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5842" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"/></svg>

    <div style="flex-grow: 1; height: 7px; border-radius: 999px; background: #F1E7D6; overflow: hidden">

    </div>
    <span style="font-size: 12px; font-weight: 700; color: #8A7660">11/12</span>
  </div>

  <div style="margin-top: 34px; font-size: 26px; font-weight: 800; line-height: 1.26; color: #3B2A17; font-family: 'Onest', sans-serif">Nimani skanerlaysiz?</div>
  <div style="margin-top: 10px; font-size: 14px; line-height: 1.55; color: #7A6753; font-weight: 500">Karavotdan uzoqroqdagi buyumni tanlang — shunda turishga majbur bo'lasiz.</div>

  <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 12px">

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 20px; border: 2px solid #E9A644; border-radius: 24px; background: linear-gradient(140deg, #FCEBC7, #F8DCA6); display: flex; align-items: center; gap: 16px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 58px; height: 58px; border-radius: 20px; background: #F3DCB0; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8A6222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M12 5v14"/><path d="M8 9.5a4 4 0 0 1 8 0"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 16.5px; font-weight: 800; color: #3B2A17; font-family: 'Onest', sans-serif">Joynamoz</span>
        <span style="font-size: 12.5px; color: #8A6222; font-weight: 600">Namozga tayyorgarlik bilan bog'liq</span>
      </span>
      <span style="width: 26px; height: 26px; border-radius: 999px; background: #C67E22; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
    </button>

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 20px; border: 2px solid transparent; border-radius: 24px; background: #FBF5EA; display: flex; align-items: center; gap: 16px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 58px; height: 58px; border-radius: 20px; background: #E3EDF2; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4A6B7C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M12 12V6.5a2.5 2.5 0 0 1 5 0V8"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 16.5px; font-weight: 700; color: #3B2A17; font-family: 'Onest', sans-serif">Rakovina</span>
        <span style="font-size: 12.5px; color: #8A7660; font-weight: 500">Hammomga borishni talab qiladi</span>
      </span>
      <span style="width: 26px; height: 26px; border-radius: 999px; border: 2px solid #DCCFB8; box-sizing: border-box; flex-shrink: 0"></span>
    </button>

    <button type="button" style="box-sizing: border-box; width: 100%; padding: 20px; border: 2px solid transparent; border-radius: 24px; background: #FBF5EA; display: flex; align-items: center; gap: 16px; cursor: pointer; text-align: left; font-family: inherit">
      <span style="width: 58px; height: 58px; border-radius: 20px; background: #E4EDE1; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4E6A49" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6.5A2.5 2.5 0 0 1 6.5 4H8"/><path d="M16 4h1.5A2.5 2.5 0 0 1 20 6.5V8"/><path d="M20 16v1.5a2.5 2.5 0 0 1-2.5 2.5H16"/><path d="M8 20H6.5A2.5 2.5 0 0 1 4 17.5V16"/><path d="M8 12h8"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 16.5px; font-weight: 700; color: #3B2A17; font-family: 'Onest', sans-serif">Ikkalasi ham</span>
        <span style="font-size: 12.5px; color: #8A7660; font-weight: 500">Qaysinisi yaqin bo'lsa, o'shani</span>
      </span>
      <span style="width: 26px; height: 26px; border-radius: 999px; border: 2px solid #DCCFB8; box-sizing: border-box; flex-shrink: 0"></span>
    </button>

  </div>

  <div style="margin-top: 20px; box-sizing: border-box; padding: 17px 18px; border-radius: 20px; background: #FBF5EA; display: flex; align-items: center; gap: 13px">
    <span style="width: 40px; height: 40px; border-radius: 14px; background: #F1E7D6; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A08B70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="13" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6.5 10 4h4l1.5 2.5"/></svg>
    </span>
    <span style="flex-grow: 1; font-size: 13px; line-height: 1.5; color: #7A6753; font-weight: 500">Kamera faqat signal vaqtida ochiladi. Rasm tekshirish uchun serverga yuboriladi va darhol o'chiriladi. Hech qayerda saqlanmaydi.</span>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="12-Paywall.html" style="box-sizing: border-box; width: 100%; height: 58px; border-radius: 20px; background: #3B2A17; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 10px 22px rgba(59, 42, 23, 0.22)">
    <span style="font-size: 16px; font-weight: 700; color: #FFF8EC">Davom etish</span>
  </a>
